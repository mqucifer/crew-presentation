[project]
name = "crew-presentation"
version = "0.4.1"
description = "Show how the crew works as visuals anyone can read"
requires-python = ">=3.12"
dependencies = [
    "jsonschema",
    "jinja2",
    "playwright==1.52.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

# Changelog fragments (mqucifer/crew#1010): each change adds changes/<issue>.<kind>.md,
# and a release builds its CHANGELOG.md section from them, in Keep a Changelog's format.
[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "mqucifer/crew-presentation#{issue}"
underlines = ["", "", ""]
wrap = false

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true
