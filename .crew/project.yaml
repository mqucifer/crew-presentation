# The project's onboarding record (#111). Intent is the Sponsor's, written
# through `crew onboard`. Design is the project's Architect's, and learned
# is the crew's; both are proposed by pull request.
version: 2
intent:
  scope:
    purpose: Show how the crew works as visuals anyone can read, on a public site
      that someone who has never seen the crew understands. How each sprint went,
      and a story's path from a Goal to merged, played back.
    in_scope:
    - A static site on GitHub Pages, built and deployed by GitHub Actions.
    - 'Its views: a sprint overview, a replay of work from a Goal to merged, and a
      story''s journey, built to the design reference in docs/design/mock/.'
    - The crew's delivery-history package, used as the crew's README says. The one
      line in delivery-history.tag at the repository's root names the release; CI
      fetches that package and validates it against the schema the package carries.
      The package already holds sprint-metrics' answers, so the site depends on the
      crew alone.
    - Python that shapes the package into the pages, and JavaScript for the replay
      player.
    - 'The look from mqucifer/design-system, used as its README''s "How projects use
      it" says: pinned once, in the site''s code, and bumped by pull request. (The
      boards in docs/design/mock/ inline those styles only so each opens on its own.)'
    - 'A check of which major versions of the package''s schema the site can display:
      a package on any other major version fails the pull request that brought it.
      Browser tests on the pages, and the site''s own contrast and token checks against
      the design system''s rules. The design system''s checks/check_tokens.py checks
      the design system itself, not a site, so the site writes its own.'
    out_of_scope:
    - Computing metrics. sprint-metrics computes them; the site arranges and shows
      what it is sent.
    - Reading the crew's events directly, or anything that carries what the crew was
      told or thought. The site reads them only through the data packages the crew
      delivers.
    - A copy of the crew's data or of any schema in the repository. History lives
      in the crew's releases, and each package carries its own schema.
    - A server, a backend, accounts or analytics. The site is static.
    - Comparing model settings, until the performance project supplies the data.
  release:
    deploys: true
    publishes: false
    where: GitHub Pages at https://mqucifer.github.io/crew-presentation/. The site
      deploys when a pull request changing delivery-history.tag merges, built from
      the latest release tag of the site's code, which is tagged when an epic completes.
  done:
    bar: A change is done when its acceptance criteria are met and every check the
      project's CI runs passes, including the package's validation, the major-version
      check, the browser tests and the site's contrast and token checks.
    never_touch:
    - .github/workflows/board.yml
    - delivery-history.tag
  priority: 2
design:
  language: Python (build, validation, template rendering) and JavaScript (the replay
    player in the browser)
  dependencies: 'Python: jsonschema (validate the package''s data against the schema
    the package carries), jinja2 (render page templates), playwright (drive browser
    tests), ruff (format and lint, dev). No npm package: the replay player is vanilla
    JavaScript loaded by the page, with no build step or framework. The design-system
    CSS is linked externally from jsDelivr at its pinned tag, not vendored.'
  sandbox: Python 3.12, a Chromium browser binary with its system libraries (for Playwright
    browser tests), and the Python packages from the lockfile. No network except during
    the setup command; nothing else places files in it.
  checks:
  - python -m pytest tests/test_contracts.py -v
  - python build.py tests/fixtures/
  - python -m pytest tests/test_browser.py -v
  - python -m pytest tests/test_tokens.py -v
  sandbox_image: mcr.microsoft.com/playwright/python:v1.52.0-noble@sha256:a1d2b48b65f41f34e5e1d7690f385f1376397b7208691cba359e4078edbf86cb
  setup: pip install -r requirements.txt
  autofix:
  - ruff format --check .
  parts:
  - path: ''
    language: python
    tests:
    - tests/test_contracts.py
    - tests/test_browser.py
    - tests/test_tokens.py
  - path: site/js/
    language: javascript
    tests:
    - tests/test_browser.py
  ci_checks:
  - The validate-package job (on the PR changing delivery-history.tag) fetches the
    delivery-history package the tag names from the crew's releases, reads the schema
    the package carries, validates the package's data against that schema, and checks
    the schema's major version against SUPPORTED_SCHEMA_MAJORS in build.py; a package
    on any other major version fails the pull request before it merges.
  - The deploy job (on the PR changing delivery-history.tag, after merge) checks out
    the site's code at its latest release tag, fetches the package, runs the full
    build, deploys the output to GitHub Pages at https://mqucifer.github.io/crew-presentation/,
    then asserts the site root and each page return HTTP 200.
  release_how: A pull request changing delivery-history.tag that merges to main triggers
    .github/workflows/deploy.yml. The job fetches the delivery-history package the
    tag names from the crew's releases, validates it against the schema the package
    carries, checks the schema's major version, checks out the site's code at its
    latest release tag (the tag is applied when an epic completes), runs the full
    build (validate, check major version, render pages from the package data, assemble
    the output with site/js/ and site/css/), deploys the output to GitHub Pages at
    https://mqucifer.github.io/crew-presentation/, then asserts the site root and
    each page return HTTP 200. A rerun of the release completes whatever the version
    is missing and changes nothing already published (§19.9).
  structure: 'build.py — the build entry point: takes a package path (or a fixtures
    path for testing), reads the schema the package carries, validates the package''s
    data against that schema, checks the schema''s major version against SUPPORTED_SCHEMA_MAJORS
    (a constant in build.py), loads site/templates/ via Jinja2, renders each page,
    copies site/js/ and site/css/ into the output directory, and writes the assembled
    site to build/. site/templates/ — Jinja2 templates, one per view: sprint_overview.html,
    replay.html, story_journey.html; each includes the design-system stylesheet link
    (jsDelivr at its pinned tag) and the site''s own CSS from site/css/. site/js/replay.js
    — the replay player: play/pause toggle, speed control (1×, 30×, 60×), skip-idle,
    timeline scrubber, event ticker, and board-state rendering; vanilla JS, no framework.
    site/css/site.css — the site''s own CSS: the scrubber, the speed control, the
    board columns, and the attempt chart; the components the design system does not
    provide. tests/ — test_contracts.py (build validation and major-version logic,
    using fixtures), test_browser.py (Playwright browser tests on rendered pages),
    test_tokens.py (design-system token and contrast checks against the site''s CSS
    and templates). tests/fixtures/ — a minimal sample package: one data file and
    one schema file, small enough to exercise the build''s validation, major-version
    check, and rendering without being a copy of the crew''s data.'
  docs:
  - README.md
