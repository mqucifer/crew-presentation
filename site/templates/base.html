<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crew Presentation{% endblock %}</title>
  <script>
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mqucifer/design-system@{{ design_system_version }}/styles.css">
  <link rel="stylesheet" href="{{ static_prefix }}{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
<div class="page">
  <header class="site-header">
    <div>
      <div class="meta">{{ crew_repository.replace('/', ' / ') }} · sprint-metrics</div>
      {% block h1 %}{% endblock %}
    </div>
    <nav class="nav" aria-label="Views">
      <a href="{{ static_prefix }}{{ sprint_slug }}" {% if current_view == 'sprint' %}aria-current="page"{% endif %}>Sprint</a>
      <a href="{{ static_prefix }}story-journey.html" {% if current_view == 'journey' %}aria-current="page"{% endif %}>A story's journey</a>
      <a href="{{ static_prefix }}replay.html" {% if current_view == 'replay' %}aria-current="page"{% endif %}>Replay</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
</div>
</body>
</html>
